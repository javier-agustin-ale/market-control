<div
  [ngClass]="{
    'checkout-container': !(isMobile$ | async),
    'checkout-container-mobile': (isMobile$ | async),
  }"
>
  <div class="available-products-container">
    <app-available-products [tabContext]="tabContextEnum.Checkout"></app-available-products>
  </div>
  @if (!(isMobile$ | async)) {
    <div class="shopping-cart-container">
      <app-shopping-cart></app-shopping-cart>
    </div>
  }
</div>
